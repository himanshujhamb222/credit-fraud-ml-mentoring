<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.4; }
    .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.4; }
    .mask { fill: #2c3e50; stroke: #1a1a1a; stroke-width: 1.2; }
    .keep { fill: #e4eadb; stroke: #1a1a1a; stroke-width: 1.2; }
    .title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
    .label { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .content { font-size: 14px; fill: #1a1a1a; }
    .light { font-size: 14px; fill: #ffffff; }
    .caption { font-size: 15px; fill: #333; }
  </style>
  <text x="520" y="34" text-anchor="middle" class="title">Hide a few words. Guess the originals.</text>

  <text x="40" y="78" class="label">Sentence</text>
  <rect x="40" y="96" width="100" height="36" class="box"/><text x="90" y="119" text-anchor="middle" class="content">the</text>
  <rect x="156" y="96" width="100" height="36" class="box"/><text x="206" y="119" text-anchor="middle" class="content">quick</text>
  <rect x="272" y="96" width="100" height="36" class="box"/><text x="322" y="119" text-anchor="middle" class="content">brown</text>
  <rect x="388" y="96" width="100" height="36" class="box"/><text x="438" y="119" text-anchor="middle" class="content">fox</text>
  <rect x="504" y="96" width="100" height="36" class="box"/><text x="554" y="119" text-anchor="middle" class="content">jumps</text>
  <rect x="620" y="96" width="100" height="36" class="box"/><text x="670" y="119" text-anchor="middle" class="content">over</text>
  <rect x="736" y="96" width="100" height="36" class="box"/><text x="786" y="119" text-anchor="middle" class="content">the</text>
  <rect x="852" y="96" width="100" height="36" class="box"/><text x="902" y="119" text-anchor="middle" class="content">dog</text>

  <text x="40" y="176" class="label">After the rule</text>
  <rect x="40" y="194" width="100" height="36" class="box"/><text x="90" y="217" text-anchor="middle" class="content">the</text>
  <rect x="156" y="194" width="100" height="36" class="mask"/><text x="206" y="217" text-anchor="middle" class="light">[MASK]</text>
  <rect x="272" y="194" width="100" height="36" class="box"/><text x="322" y="217" text-anchor="middle" class="content">brown</text>
  <rect x="388" y="194" width="100" height="36" class="mask"/><text x="438" y="217" text-anchor="middle" class="light">[MASK]</text>
  <rect x="504" y="194" width="100" height="36" class="box"/><text x="554" y="217" text-anchor="middle" class="content">jumps</text>
  <rect x="620" y="194" width="100" height="36" class="hot"/><text x="670" y="217" text-anchor="middle" class="content">cat</text>
  <rect x="736" y="194" width="100" height="36" class="box"/><text x="786" y="217" text-anchor="middle" class="content">the</text>
  <rect x="852" y="194" width="100" height="36" class="keep"/><text x="902" y="217" text-anchor="middle" class="content">dog</text>

  <text x="520" y="270" text-anchor="middle" class="caption">[MASK] is the 80% path. quick and fox were replaced.</text>
  <text x="520" y="298" text-anchor="middle" class="caption">A random word is the 10% path. over became cat.</text>
  <text x="520" y="326" text-anchor="middle" class="caption">The word can stay. That is the 10% path. dog stayed dog.</text>

  <rect x="170" y="356" width="700" height="96" class="box"/>
  <text x="520" y="392" text-anchor="middle" class="label">BERT encoder</text>
  <text x="520" y="422" text-anchor="middle" class="caption">Each word can use words on both sides.</text>

  <rect x="330" y="480" width="380" height="40" class="hot"/>
  <text x="520" y="505" text-anchor="middle" class="content">small layer to the vocabulary</text>

  <rect x="300" y="548" width="440" height="40" class="box"/>
  <text x="520" y="573" text-anchor="middle" class="content">loss only on the selected words</text>

  <text x="520" y="640" text-anchor="middle" class="caption">The other positions add nothing to the loss.</text>
</svg>
