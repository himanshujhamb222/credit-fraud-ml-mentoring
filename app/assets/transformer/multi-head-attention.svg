<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
    .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
    .h1 { fill: #fbe9d7; stroke: #1a1a1a; stroke-width: 1.2; }
    .h2 { fill: #d8e6f0; stroke: #1a1a1a; stroke-width: 1.2; }
    .h3 { fill: #e4eadb; stroke: #1a1a1a; stroke-width: 1.2; }
    .h4 { fill: #efdce2; stroke: #1a1a1a; stroke-width: 1.2; }
    .title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
    .label { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .content { font-size: 15px; fill: #1a1a1a; }
    .caption { font-size: 15px; fill: #333; }
  </style>
  <text x="520" y="36" text-anchor="middle" class="title">Several lookups, then one join</text>

  <rect x="420" y="58" width="200" height="40" class="hot"/>
  <text x="520" y="83" text-anchor="middle" class="content">input X</text>

  <rect x="250" y="130" width="120" height="36" class="box"/><text x="310" y="153" text-anchor="middle" class="content">make Q</text>
  <rect x="460" y="130" width="120" height="36" class="box"/><text x="520" y="153" text-anchor="middle" class="content">make K</text>
  <rect x="670" y="130" width="120" height="36" class="box"/><text x="730" y="153" text-anchor="middle" class="content">make V</text>
  <line x1="480" y1="98" x2="330" y2="128" stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="520" y1="98" x2="520" y2="128" stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="560" y1="98" x2="710" y2="128" stroke="#1a1a1a" stroke-width="1.3"/>

  <text x="520" y="204" text-anchor="middle" class="caption">Split each of those into 4 heads.</text>

  <text x="36" y="252" class="label">queries</text>
  <rect x="200" y="230" width="140" height="36" class="h1"/><text x="270" y="253" text-anchor="middle" class="content">Q1</text>
  <rect x="360" y="230" width="140" height="36" class="h2"/><text x="430" y="253" text-anchor="middle" class="content">Q2</text>
  <rect x="520" y="230" width="140" height="36" class="h3"/><text x="590" y="253" text-anchor="middle" class="content">Q3</text>
  <rect x="680" y="230" width="140" height="36" class="h4"/><text x="750" y="253" text-anchor="middle" class="content">Q4</text>

  <text x="36" y="312" class="label">keys</text>
  <rect x="200" y="290" width="140" height="36" class="h1"/><text x="270" y="313" text-anchor="middle" class="content">K1</text>
  <rect x="360" y="290" width="140" height="36" class="h2"/><text x="430" y="313" text-anchor="middle" class="content">K2</text>
  <rect x="520" y="290" width="140" height="36" class="h3"/><text x="590" y="313" text-anchor="middle" class="content">K3</text>
  <rect x="680" y="290" width="140" height="36" class="h4"/><text x="750" y="313" text-anchor="middle" class="content">K4</text>

  <text x="36" y="372" class="label">values</text>
  <rect x="200" y="350" width="140" height="36" class="h1"/><text x="270" y="373" text-anchor="middle" class="content">V1</text>
  <rect x="360" y="350" width="140" height="36" class="h2"/><text x="430" y="373" text-anchor="middle" class="content">V2</text>
  <rect x="520" y="350" width="140" height="36" class="h3"/><text x="590" y="373" text-anchor="middle" class="content">V3</text>
  <rect x="680" y="350" width="140" height="36" class="h4"/><text x="750" y="373" text-anchor="middle" class="content">V4</text>

  <text x="520" y="424" text-anchor="middle" class="caption">Each head runs attention on its own slice.</text>

  <rect x="90" y="448" width="180" height="56" class="h1"/>
  <text x="180" y="470" text-anchor="middle" class="content">head 1</text>
  <text x="180" y="490" text-anchor="middle" class="caption">who did it</text>
  <rect x="300" y="448" width="180" height="56" class="h2"/>
  <text x="390" y="470" text-anchor="middle" class="content">head 2</text>
  <text x="390" y="490" text-anchor="middle" class="caption">nearby words</text>
  <rect x="510" y="448" width="180" height="56" class="h3"/>
  <text x="600" y="470" text-anchor="middle" class="content">head 3</text>
  <text x="600" y="490" text-anchor="middle" class="caption">a repeat</text>
  <rect x="720" y="448" width="180" height="56" class="h4"/>
  <text x="810" y="470" text-anchor="middle" class="content">head 4</text>
  <text x="810" y="490" text-anchor="middle" class="caption">names</text>

  <line x1="180" y1="504" x2="420" y2="548" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="390" y1="504" x2="480" y2="548" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="600" y1="504" x2="560" y2="548" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="810" y1="504" x2="620" y2="548" stroke="#1a1a1a" stroke-width="1.2"/>

  <rect x="360" y="556" width="320" height="40" class="hot"/>
  <text x="520" y="581" text-anchor="middle" class="content">join back to one vector</text>

  <rect x="390" y="620" width="260" height="40" class="box"/>
  <text x="520" y="645" text-anchor="middle" class="content">multiply by W_o</text>

  <rect x="400" y="684" width="240" height="40" class="hot"/>
  <text x="520" y="709" text-anchor="middle" class="content">output</text>
  <text x="520" y="770" text-anchor="middle" class="caption">W_o mixes the heads. Before that, each head stays separate.</text>
</svg>
