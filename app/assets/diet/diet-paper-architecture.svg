<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.3; }
    .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.3; }
    .enc { fill: #e7edd9; stroke: #1a1a1a; stroke-width: 1.3; }
    .dec { fill: #d7e3ee; stroke: #1a1a1a; stroke-width: 1.3; }
    .mask { fill: #f3e8f5; stroke: #1a1a1a; stroke-width: 1.3; }
    .title { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
    .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .content { font-size: 12px; fill: #1a1a1a; }
    .small { font-size: 11px; fill: #333; }
    .cap { font-size: 12px; fill: #444; font-style: italic; }
  </style>
  <text x="550" y="28" text-anchor="middle" class="title">DIET architecture (paper Figure 1)</text>
  <text x="550" y="48" text-anchor="middle" class="cap">"play ping pong" -&gt; intent play_game, entity game_name="ping pong". Shared FF weights across tokens.</text>
  <rect x="60" y="70" width="120" height="40" class="hot"/>
  <text x="120" y="95" text-anchor="middle" class="content">play</text>
  <rect x="200" y="70" width="120" height="40" class="hot"/>
  <text x="260" y="95" text-anchor="middle" class="content">ping</text>
  <rect x="340" y="70" width="120" height="40" class="hot"/>
  <text x="400" y="95" text-anchor="middle" class="content">pong</text>
  <rect x="480" y="70" width="120" height="40" class="hot"/>
  <text x="540" y="95" text-anchor="middle" class="content">__CLS__</text>
  <text x="700" y="95" class="small">(+ optional __MASK__ tokens in training)</text>
  <rect x="60" y="130" width="540" height="36" class="box"/>
  <text x="330" y="153" text-anchor="middle" class="content">sparse features: word one-hot + char n-grams (n &lt;= 5) + dropout</text>
  <rect x="60" y="176" width="540" height="36" class="dec"/>
  <text x="330" y="199" text-anchor="middle" class="content">dense features: GloVe / BERT / ConveRT (plug-and-play, often frozen)</text>
  <rect x="60" y="230" width="540" height="36" class="enc"/>
  <text x="330" y="253" text-anchor="middle" class="label">shared FF: sparse -&gt; dense width, then concat [sparse' || dense]</text>
  <rect x="60" y="280" width="540" height="36" class="enc"/>
  <text x="330" y="303" text-anchor="middle" class="label">shared FF: concat -&gt; transformer width (256)</text>
  <rect x="60" y="335" width="540" height="90" class="hot"/>
  <text x="330" y="365" text-anchor="middle" class="label">2-layer Transformer + relative position attention</text>
  <text x="330" y="390" text-anchor="middle" class="content">outputs a_play, a_ping, a_pong, a_CLS  (and a_MASK if masked)</text>
  <text x="330" y="412" text-anchor="middle" class="small">contextual sequence a</text>
  <rect x="40" y="460" width="300" height="150" class="dec"/>
  <text x="190" y="490" text-anchor="middle" class="label">Intent head</text>
  <text x="190" y="515" text-anchor="middle" class="content">embed a_CLS and intent labels</text>
  <text x="190" y="538" text-anchor="middle" class="content">into shared space h in R^20</text>
  <text x="190" y="561" text-anchor="middle" class="content">dot-product loss L_I</text>
  <text x="190" y="586" text-anchor="middle" class="content">-&gt; play_game</text>
  <rect x="360" y="460" width="300" height="150" class="hot"/>
  <text x="510" y="490" text-anchor="middle" class="label">Entity head (CRF)</text>
  <text x="510" y="515" text-anchor="middle" class="content">CRF over token outputs a_t</text>
  <text x="510" y="538" text-anchor="middle" class="content">L_E = L_CRF(a, y_entity)</text>
  <text x="510" y="561" text-anchor="middle" class="content">tags: O, B/I/L-game_name</text>
  <text x="510" y="586" text-anchor="middle" class="content">-&gt; "ping pong"</text>
  <rect x="680" y="460" width="380" height="150" class="mask"/>
  <text x="870" y="490" text-anchor="middle" class="label">Mask head (optional)</text>
  <text x="870" y="515" text-anchor="middle" class="content">15% tokens: 70% MASK / 10% rand / 20% keep</text>
  <text x="870" y="538" text-anchor="middle" class="content">same dot-product loss on a_MASK</text>
  <text x="870" y="561" text-anchor="middle" class="content">L_M (regularizer; can be turned off)</text>
  <text x="870" y="586" text-anchor="middle" class="content">rebuild hidden tokens</text>
  <rect x="200" y="640" width="700" height="70" class="enc"/>
  <text x="550" y="670" text-anchor="middle" class="label">L_total = L_I + L_E + L_M</text>
  <text x="550" y="694" text-anchor="middle" class="content">multi-task training | any term can be switched off | balanced batching</text>
  <text x="550" y="750" text-anchor="middle" class="cap">Bunk et al., 2020 - Dual Intent and Entity Transformer (arxiv:2004.09936)</text>
</svg>
