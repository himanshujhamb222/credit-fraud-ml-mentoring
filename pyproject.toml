[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-fraud"
version = "0.1.0"
description = "Mentoring repo: imbalanced credit-fraud modeling with RF, XGBoost, Optuna, Streamlit, FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "optuna>=3.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.18",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "streamlit>=1.32",
  "joblib>=1.3",
  "pydantic>=2.0",
  "requests>=2.31",
  "openml>=0.14",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
